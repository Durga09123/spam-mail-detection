<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spam Mail Detection</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 15px; }
    textarea { width: 100%; height: 150px; padding: 10px; font-size: 16px; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; }
    .spam { color: red; }
    .safe { color: green; }
  </style>
</head>
<body>
  <h1>Spam Mail Detection</h1>
  <p>Paste an email message to check whether it is spam.</p>

  <form method="POST">
    <textarea name="message" required placeholder="Type or paste the email here...">{{ message }}</textarea>
    <br>
    <button type="submit">Analyze</button>
  </form>

  {% if result %}
  <div class="result">
    <h2 class="{{ 'spam' if 'SPAM' in result else 'safe' }}">{{ result }}</h2>
    <p>Confidence: {{ confidence }}%</p>
    <p>Reason: {{ reason }}</p>
  </div>
  {% endif %}
</body>
</html>
